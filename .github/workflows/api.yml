# API tests on every push and pull request, including the permission leak tests (2.16).
name: api

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
      falkordb:
        image: falkordb/falkordb:v4.10.3
        ports: ["6379:6379"]
    env:
      MIX_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "29"
          elixir-version: "1.20"
      - uses: actions/cache@v4
        with:
          path: |
            api/deps
            api/_build
          key: mix-${{ runner.os }}-${{ hashFiles('api/mix.lock') }}
      - run: mix deps.get
      - run: mix format --check-formatted
      - run: mix compile --warnings-as-errors
      - run: mix test

  voice:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api/priv/voice
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: api/priv/voice/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: node --check worker.mjs
