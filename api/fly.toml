# Noa API on Fly.io. Deploy from api/: `fly deploy` (see docs/deploy.md).
# Run exactly one machine: the projector, WhatsApp notifier and Discord gateway are
# singletons, so `fly deploy --ha=false` and never scale past 1.
app = "noa-api"
primary_region = "bom"

[build]
  dockerfile = "Dockerfile"

[deploy]
  release_command = "/app/bin/migrate"
  strategy = "immediate"

[env]
  PHX_SERVER = "true"
  PORT = "4000"
  ECTO_IPV6 = "true"
  FALKORDB_IPV6 = "true"
  CLIENT_IP_HEADER = "fly-client-ip"
  POOL_SIZE = "10"
  WEB_ORIGIN = "https://app.notyouridea.com"
  API_BASE_URL = "https://api.notyouridea.com"
  MAIL_FROM_NAME = "Noa"
  MAIL_FROM_EMAIL = "noa@notyouridea.com"
  KAPSO_TEMPLATE_UPDATE = "noa_update"
  KAPSO_TEMPLATE_TASK = "noa_task"
  KAPSO_TEMPLATE_APPROVAL = "noa_approval"
  KAPSO_TEMPLATE_LANG = "en_US"

[http_service]
  internal_port = 4000
  force_https = true
  # Background work (projector, notifier, Discord, Oban) needs the machine up.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "connections"
    soft_limit = 800
    hard_limit = 1000

  [[http_service.checks]]
    grace_period = "30s"
    interval = "15s"
    method = "GET"
    path = "/healthz"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
