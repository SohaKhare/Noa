# Noa on one server (any VM with Docker): Postgres, FalkorDB, API, web, landing and
# Caddy for HTTPS. From the repo root:
#   cp deploy/prod.env.example deploy/prod.env   # fill it in
#   docker compose -f deploy/docker-compose.prod.yml --env-file deploy/prod.env up -d --build
# DNS: point LANDING_HOST, APP_HOST and API_HOST at the server first (Caddy gets certificates).
name: noa

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: noa
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: noa
    volumes:
      - pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U noa"]
      interval: 3s
      retries: 30

  falkordb:
    image: falkordb/falkordb:v4.10.3
    restart: unless-stopped
    environment:
      REDIS_ARGS: --requirepass ${FALKORDB_PASSWORD:?set FALKORDB_PASSWORD} --appendonly yes
    volumes:
      - falkor:/data

  api:
    build: ../api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      falkordb:
        condition: service_started
    env_file: prod.env
    environment:
      DATABASE_URL: ecto://noa:${POSTGRES_PASSWORD}@postgres/noa
      FALKORDB_URL: redis://:${FALKORDB_PASSWORD}@falkordb:6379
      WEB_ORIGIN: https://${APP_HOST}
      API_BASE_URL: https://${API_HOST}
      PHX_SERVER: "true"
      # Caddy overwrites this header with the real client address.
      CLIENT_IP_HEADER: x-real-ip
    # Migrations run on every start; they are idempotent.
    command: ["sh", "-c", "/app/bin/migrate && exec /app/bin/server"]

  web:
    build:
      context: ..
      dockerfile: web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: https://${API_HOST}
    restart: unless-stopped

  landing:
    build:
      context: ..
      dockerfile: landing/Dockerfile
      args:
        NEXT_PUBLIC_APP_URL: https://${APP_HOST}
        NEXT_PUBLIC_CDN_URL: ${NEXT_PUBLIC_CDN_URL:-https://cdn.saish.xyz}
    restart: unless-stopped

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      LANDING_HOST: ${LANDING_HOST}
      APP_HOST: ${APP_HOST}
      API_HOST: ${API_HOST}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy:/data
    depends_on: [api, web, landing]

volumes:
  pg:
  falkor:
  caddy:
